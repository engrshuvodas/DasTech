<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Portal Login — DasTech</title>
  <meta content="Sign in to your DasTech client and administration portal." name="description">

  <!-- Favicons -->
  <link href="./assets/img/favicon.png" rel="icon">
  <link href="./assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="./assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="./assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="./assets/css/style.css" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-light">

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="./index.html" class="dastech-brand text-decoration-none">
                  <span class="brand-icon"><i class="bi bi-cpu-fill"></i></span>
                  <span class="fs-3 fw-bold text-dark">Das<span class="brand-text-accent">Tech</span></span>
                </a>
              </div>

              <div class="card mb-3 border-0 shadow-sm rounded-4 p-3 bg-white w-100">

                <div class="card-body">

                  <div class="pt-2 pb-3 text-center">
                    <h5 class="card-title pb-0 fs-4 fw-bold">Welcome Back</h5>
                    <p class="small text-muted mb-0">Enter your credentials to access your DasTech Portal</p>
                  </div>

                  <form class="row g-3 needs-validation" novalidate>

                    <div class="col-12">
                      <label for="yourUsername" class="form-label small fw-bold">Email Address</label>
                      <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" name="username" class="form-control form-control-light border-start-0" id="yourUsername" required placeholder="admin@dastech.io">
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                      </div>
                    </div>

                    <div class="col-12">
                      <div class="d-flex justify-content-between align-items-center">
                        <label for="yourPassword" class="form-label small fw-bold mb-1">Password</label>
                        <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
                      </div>
                      <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control form-control-light border-start-0" id="yourPassword" required placeholder="••••••••">
                        <div class="invalid-feedback">Please enter your password!</div>
                      </div>
                    </div>

                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" value="true" id="rememberMe" checked>
                        <label class="form-check-label small text-muted" for="rememberMe">Remember my session</label>
                      </div>
                    </div>

                    <div class="col-12">
                      <a class="btn btn-dastech-primary w-100 py-2 fw-bold" href="./dashboard.html">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                      </a>
                    </div>
                    <div class="col-12 text-center">
                      <p class="small mb-0 text-muted">Don't have an account? <a href="./register.html" class="text-primary fw-semibold">Create an account</a></p>
                    </div>
                  </form>

                </div>
              </div>

              <div class="text-center text-muted small mt-2">
                &copy; <span id="currentYear"></span> <strong>DasTech</strong>. All Rights Reserved.
              </div>

            </div>
          </div>
        </div>

      </section>

    </div>
  </main>

  <script src="./assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>

</body>

</html>
