<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Create Account — DasTech Portal</title>
  <meta content="Register for a new DasTech client portal account." name="description">

  <!-- Favicons -->
  <link href="./assets/img/favicon.png" rel="icon">
  <link href="./assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="./assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="./assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="./assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="./assets/css/style.css" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>

<body>

  <main>
    <div class="container">

      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-between align-items-center w-100 py-4">
                <a href="./index.html" class="dastech-brand text-decoration-none" data-cursor="EXPLORE">
                  <span class="brand-icon"><i class="bi bi-cpu-fill"></i></span>
                  <span class="fs-3 fw-bold">Das<span class="brand-text-accent">Tech</span></span>
                </a>
                <button class="dastech-theme-toggle" aria-label="Toggle Theme" title="Switch Theme">
                  <i class="bi bi-sun-fill text-warning"></i>
                </button>
              </div>

              <div class="card mb-3 border-0 shadow-sm rounded-4 p-3 bg-dark-card w-100" data-tilt>

                <div class="card-body">

                  <div class="pt-2 pb-3 text-center">
                    <h5 class="card-title pb-0 fs-4 fw-bold text-white">Create an Account</h5>
                    <p class="small text-muted mb-0">Join the DasTech developer and client ecosystem</p>
                  </div>

                  <form class="row g-3 needs-validation" novalidate>
                    <div class="col-12">
                      <label for="yourName" class="form-label small fw-bold">Full Name</label>
                      <input type="text" name="name" class="form-control form-control-light" id="yourName" required placeholder="Alex Morgan">
                    </div>

                    <div class="col-12">
                      <label for="yourEmail" class="form-label small fw-bold">Work Email</label>
                      <input type="email" name="email" class="form-control form-control-light" id="yourEmail" required placeholder="alex@company.com">
                    </div>

                    <div class="col-12">
                      <label for="yourPassword" class="form-label small fw-bold">Password</label>
                      <input type="password" name="password" class="form-control form-control-light" id="yourPassword" required placeholder="••••••••">
                    </div>

                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" name="terms" type="checkbox" value="" id="acceptTerms" required>
                        <label class="form-check-label small text-muted" for="acceptTerms">I agree to the <a href="#" class="text-primary text-decoration-none">Terms and Conditions</a></label>
                      </div>
                    </div>

                    <div class="col-12 mt-4">
                      <a href="dashboard.html" class="btn btn-dastech-primary w-100 py-2 fw-bold" data-cursor="EXPLORE" data-magnetic>Create Account</a>
                    </div>

                    <div class="col-12 text-center mt-3">
                      <p class="small mb-0 text-muted">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Log in</a></p>
                    </div>
                  </form>

                </div>
              </div>

              <div class="text-center text-muted small mt-2">
                &copy; <span id="currentYear"></span> DasTech. All Rights Reserved.
              </div>

            </div>
          </div>
        </div>

      </section>

    </div>
  </main>

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="./assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/dastech-interactions.js"></script>
  <script src="./assets/js/main.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>

</html>
