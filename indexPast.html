<!doctype html>
<html lang="en">
  <head>

    <title>DasTech — Digital Products Studio</title>

    <!-- Favicons -->
    <link href="./assets/img/favicon.png" rel="icon">
    <link href="./assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <link href="./style.css" rel="stylesheet">
    <style>
      .showcase {
        width: 100%;
        height: 100vh;
        position: relative;
        color: white;
      }

      .showcase img {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;

        object-fit: cover;
      }

      .showcase .overlay {
        width: 100%;
        height: 100vh;
        background-color: rgba(11, 15, 25, 0.85);
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 1.5rem;
      }
    </style>
  </head>
  <body>
    <section class="showcase">
      <img src="./assets/img/diagnostic1.jpg" alt="DasTech Hero">
      <div class="overlay text-center px-3">
        <h1 class="display-4 fw-bold text-white mb-2">DasTech</h1>
        <p class="text-light lead mb-4">Building Digital Products That Move Businesses Forward</p>
        <div class="d-flex gap-3">
          <a href="./index.html" class="btn btn-dastech-primary btn-dastech-lg">Public Website</a>
          <a href="./login.html" class="btn btn-dastech-outline btn-dastech-lg text-white border-white">Admin Portal</a>
        </div>
